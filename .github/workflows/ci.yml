# CI for the decision engine and the service around it.
#
# `quality` is the fast, always-on gate: lint, format, and the full Python test suite.
#
# The suite is not a coverage exercise — it is the spec. Most of it asserts that the
# engine REFUSES to move money under conditions where moving it would be unsafe, so a
# red build here means the engine may have become willing to overdraft someone.
#
# Two things this gate now also catches, both of which are silent failures otherwise:
#
#   - **A stale artifact.** `backend/data/decisions.json` is committed rather than built at
#     deploy time, so it can drift from the code that generates it. `tests/test_precompute.py`
#     regenerates it and asserts the bytes match, which turns a drifted demo into a red build
#     rather than a strange number nobody notices.
#   - **A guard that stopped guarding.** `tests/test_assistant.py` is mostly an attempt to get
#     a false financial claim past the assistant's verification guard. If those go green while
#     the guard is broken, the product will confidently tell a household something untrue about
#     their own money.
#
# `deployable` is the gate `quality` structurally cannot be — see its own comment. It exists
# because `quality` installs a **different dependency list** than the deploy does, and the two
# disagreed for eleven tickets without a single red build (ticket `0033`).
#
# `mobile` is a typecheck and the component suite. Nothing here builds a native binary or
# touches a device — that is not what this gate is for.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # A real Postgres, not a stand-in. `tests/test_schema.py` and `tests/test_idor.py` are about
    # row-level security and declarative partitioning — a SQLite substitute would test a
    # different artifact and report green. Ticket 0020.
    #
    # This is a service container rather than Neon on purpose: CI must not depend on an external
    # instance for its secrets, its bill, or its uptime. Neon is stock Postgres, so the drift is
    # nil, and the deployed instance is ticket 0026's business.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cfo_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check engine sim backend tests

      - name: Format check
        run: ruff format --check engine sim backend tests

      - name: Tests
        run: pytest
        env:
          # The service refuses to start without these, which is the point — a deploy missing
          # a secret should fail at startup, not the first time a user asks a question. Neither
          # value is ever used to call anything: the Anthropic client is replaced by a fake in
          # every test that exercises the assistant.
          RESFI_API_KEY: ci-not-a-real-key
          ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key
          # Without this the database suites **skip**, and a skipped security test reports green
          # while proving nothing. `tests/test_ci_runs_the_db_suite.py` fails the build if this
          # is ever unset here, so the skip cannot go quiet.
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cfo_ai_test

  # The deployed image can actually start. Ticket 0033.
  #
  # **This must be its own job, and that is the whole point.** There are two dependency lists:
  # `pyproject.toml`'s `[api]` extra (what `quality` and every developer install) and
  # `backend/requirements.txt` (what Cloud Run's buildpack installs). Nothing compared them, and
  # they disagreed from ticket `0020` to `0031` — the deploy manifest listed no database driver
  # while `backend/main.py` imported SQLAlchemy at module load. The container could not boot.
  #
  # Every test stayed green the entire time, because CI installs the list that was correct. Adding
  # this as a *step* in `quality` would reproduce that exact bug: the extra is already installed
  # there, so the import would succeed no matter what this file says. A clean environment is the
  # only thing that tests the claim.
  #
  # It is an import, not a request: `import backend.main` executes every module-level import in the
  # serving path, which is where a missing runtime dependency actually bites. It does not run the
  # lifespan — that needs a database, which is `quality`'s job and the deploy's problem.
  #
  # Mutation-tested when it was written: with the driver removed from the manifest this fails with
  # `ModuleNotFoundError: No module named 'sqlalchemy'` — the same error Cloud Run would hit — and
  # with it present it passes. It would have caught `0033` the day `0024` merged, in four seconds.
  deployable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately NOT `pip install -e ".[dev]"`. See above — that is the other list.
      - name: Install only what Cloud Run installs
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: The serving path imports
        run: python -c "import backend.main"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      # The actual fix for the timeout flake that blocked three PRs — none of which touched
      # `mobile/`, one of which was documentation-only (run 29364274507).
      #
      # jest-expo babel-transforms the whole React Native + Expo module graph on first render:
      # measured at 13.86s cold against 2.38s warm for the same 9 tests. On a cold runner that
      # cost lands on whichever test renders first, which is why a *different* test failed each
      # run. Restoring the transform cache means CI stops paying it on every run; `testTimeout`
      # in mobile/jest.config.js is the safety net for the run that misses this cache.
      #
      # Keyed on the lockfile: a dependency change is exactly when the transforms are stale.
      - name: Cache jest transforms
        uses: actions/cache@v4
        with:
          path: mobile/.jest-cache
          key: jest-${{ runner.os }}-node22-${{ hashFiles('mobile/package-lock.json') }}

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci
