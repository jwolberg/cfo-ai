# CI for the decision engine.
#
# `quality` is the fast, always-on gate: lint, format, and the full test suite.
#
# The suite is not a coverage exercise — it is the spec. Most of it asserts that the
# engine REFUSES to move money under conditions where moving it would be unsafe, so a
# red build here means the engine may have become willing to overdraft someone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check engine tests

      - name: Format check
        run: ruff format --check engine tests

      - name: Tests
        run: pytest
