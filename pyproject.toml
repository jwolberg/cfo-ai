[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfo-ai"
version = "0.1.0"
description = "Deterministic decision engine for autonomous debt paydown"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The API layer. `engine`/`sim` stay dependency-free — this is the web shell around them.
api = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",  # fastapi.testclient
    "cfo-ai[api]",
]

[tool.setuptools]
packages = ["engine", "sim", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
